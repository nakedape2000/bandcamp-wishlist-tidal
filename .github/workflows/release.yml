name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run verify:m5
      - run: BCTS_RELEASE_TAG="$GITHUB_REF_NAME" bun run release:check
      - name: Build package archive
        run: bun pm pack --filename "bandcamp-tidal-sync-${GITHUB_REF_NAME#v}.tgz"
      - name: Validate npm publish payload
        run: npm publish --dry-run --ignore-scripts
      - name: Generate checksum
        run: shasum -a 256 bandcamp-tidal-sync-*.tgz > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: bandcamp-tidal-sync-*.tgz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bandcamp-tidal-sync-*.tgz
            SHA256SUMS
