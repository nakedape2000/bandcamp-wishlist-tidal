name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c7c7bcb0773cc4678a674ada03a66cc5c4325476 # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        --recursive
        ./
      upload-sarif: false
      fail-on-vuln: true

  build-and-attest:
    needs: [secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run verify:m5
      - run: BCTS_RELEASE_TAG="$GITHUB_REF_NAME" bun run release:check
      - name: Build package archive
        run: bun pm pack --filename "bandcamp-tidal-sync-${GITHUB_REF_NAME#v}.tgz"
      - name: Smoke test installed package
        run: bun run package:smoke -- "bandcamp-tidal-sync-${GITHUB_REF_NAME#v}.tgz"
      - name: Validate npm publish payload
        run: npm publish --dry-run --ignore-scripts
      - name: Generate checksum
        run: shasum -a 256 bandcamp-tidal-sync-*.tgz > SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bandcamp-tidal-sync-*.tgz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bandcamp-tidal-sync-*.tgz
            SHA256SUMS
